<mat-toolbar class="app-header">
  <button mat-icon-button aria-label="Abrir menú" (click)="menuClick.emit()">
    <mat-icon>menu</mat-icon>
  </button>

  <div class="brand-mark" aria-hidden="true">
    <img class="brand-isotipo" src="/assets/branding/kodvian-isotipo.svg" alt="Isotipo Kodvian" />
  </div>

  <div class="title-block">
    <span class="title"><span class="title-k">k</span><span class="title-kodvian">odvian</span><span class="title-gap"></span><span class="title-solutions">solutions</span><span class="title-semicolon">;</span></span>
    <span class="subtitle">Soluciones informáticas hechas a medida</span>
  </div>

  <span class="spacer"></span>

  <span class="session-pill">Operación segura</span>

  <button mat-icon-button aria-label="Cerrar sesión" (click)="logoutClick.emit()">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>
